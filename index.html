<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기초 지지력 계산기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        
        /* 📱 모바일 반응형 입력 그리드 스타일 */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 스마트폰에서는 가로 2칸씩 배치 */
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) {
            .input-grid {
                grid-template-columns: repeat(3, 1fr); /* 화면이 넓어지면 가로 3칸으로 자동 변경 */
            }
        }
        .input-group {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }
        .input-group label {
            font-size: 0.85em;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            word-break: keep-all; /* 단어 단위로 줄바꿈되어 깔끔하게 표시 */
        }
        .input-group input {
            width: 100%;
            padding: 8px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* 패딩 밖으로 삐져나가지 않도록 고정 */
            font-size: 1.1em;
        }
        
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; font-size: 1.1em; line-height: 1.6; }
    </style>
    
    <!-- PWA 연결 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c8c8c8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">
    <h2>◎ 기초 지지력 산정</h2>
    
    <h3>1. 설계자료 입력</h3>
    
    <!-- 수정된 반응형 입력 박스 -->
    <div class="input-grid">
        <div class="input-group">
            <label>기초 길이 L (m)</label>
            <input type="number" id="L" value="2.00" step="0.01">
        </div>
        <div class="input-group">
            <label>기초 폭 B (m)</label>
            <input type="number" id="B" value="1.82" step="0.01">
        </div>
        <div class="input-group">
            <label>근입 깊이 Df (m)</label>
            <input type="number" id="Df" value="2.20" step="0.01">
        </div>
        <div class="input-group">
            <label>점착력 c (kN/m²)</label>
            <input type="number" id="c" value="3.0" step="0.1">
        </div>
        <div class="input-group">
            <label>상재하중 q (kN/m²)</label>
            <input type="number" id="q" value="39.6" step="0.1">
        </div>
        <div class="input-group">
            <label>단위중량 γ2 (kN/m²)</label>
            <input type="number" id="gamma2" value="14.48" step="0.01">
        </div>
    </div>
    
    <p style="font-size: 0.85em; color: #555;">※ 현재 프로토타입은 내부마찰각(Φ) = 25도를 기준으로 세팅되어 있습니다 (Nc=25.1, Nq=12.7, Nγ=9.7).</p>

    <button onclick="calculateBearingCapacity()">지지력 계산하기</button>

    <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
    function calculateBearingCapacity() {
        const L = parseFloat(document.getElementById('L').value);
        const B = parseFloat(document.getElementById('B').value);
        const c = parseFloat(document.getElementById('c').value);
        const q = parseFloat(document.getElementById('q').value);
        const gamma2 = parseFloat(document.getElementById('gamma2').value);
        
        const alpha = 1 + 0.3 * (B / L);
        const beta = 0.5 - 0.1 * (B / L);

        const Nc = 25.1;
        const Nq = 12.7;
        const Ng = 9.7;

        const term1 = alpha * c * Nc;
        const term2 = q * Nq;
        const term3 = beta * gamma2 * B * Ng;
        const q_ult = term1 + term2 + term3;

        const q_all = q_ult / 3;

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <strong>[형상계수 산정]</strong><br>
            α = ${alpha.toFixed(2)}, β = ${beta.toFixed(2)}<br><br>
            <strong>[Terzaghi 극한지지력]</strong><br>
            q_ult = ${term1.toFixed(1)} + ${term2.toFixed(1)} + ${term3.toFixed(1)} = <strong>${q_ult.toFixed(1)} kN/m²</strong><br><br>
            <strong>[허용지지력 (FS=3 적용)]</strong><br>
            q_all = ${q_ult.toFixed(1)} / 3 = <strong>${q_all.toFixed(2)} kN/m²</strong>
        `;
    }
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>

</body>
</html>
