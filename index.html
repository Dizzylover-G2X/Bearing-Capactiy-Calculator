<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지반공학 통합 설계 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c8c8c8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">
    <!-- 상단 대시보드 제목 및 전체 초기화 버튼 -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0;">◎ 지반공학 구조 설계 통합 대시보드</h2>
        <button type="button" id="global_reset_btn" style="padding: 6px 12px; background: #e74c3c; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em;">🔄 전체 데이터 초기화</button>
    </div>
    
    <!-- 탭 네비게이션 바 -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="bearing">지지력 검토(직접기초)</button>
        <button class="tab-btn" data-tab="settlement">침하량 검토(직접기초)</button>
        <button class="tab-btn" data-tab="pile">지지력/침하량 검토<br>(말뚝기초)</button>
        <button class="tab-btn" data-tab="consolidation">압밀침하량</button>
        <button class="tab-btn" data-tab="slope">사면안정</button>
    </div>

    <!-- 각 모듈이 렌더링될 동적 컨테이너 영역 -->
    <div id="app-content"></div>
</div>

<!-- 메인 진입점 (ES6 모듈) -->
<script type="module" src="js/main.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>

</body>
</html>
