<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기초 지지력 통합 비교 대시보드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        
        /* 모바일 반응형 입력 그리드 스타일 */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) {
            .input-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        .input-group {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            min-width: 0;
        }
        .input-group label {
            font-size: 0.8em;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            word-break: keep-all;
        }
        .input-group input {
            width: 100%;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1.05em;
        }
        
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        
        .result-box { margin-top: 20px; padding: 15px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; font-size: 0.95em; line-height: 1.5; display: none; }
        
        /* 종합 및 상세 비교 표 스타일 */
        .summary-table, .result-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 15px 0;
            background: #fff;
            font-size: 0.85em;
        }
        .summary-table th, .summary-table td, .result-table th, .result-table td {
            border: 1px solid #bdc3c7;
            padding: 8px 6px;
            text-align: center;
        }
        .summary-table th {
            background-color: #3498db;
            color: white;
        }
        .summary-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .result-table th {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        .table-container {
            overflow-x: auto;
            margin-bottom: 10px;
        }
        .section-title {
            margin-top: 25px;
            color: #2c3e50;
            border-left: 4px solid #3498db;
            padding-left: 8px;
            font-size: 1.1em;
            font-weight: bold;
        }
    </style>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c8c8c8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">
    <h2>◎ 직접기초 지지력 통합 비교 대시보드</h2>
    
    <h3>1. 설계자료 입력</h3>
    
    <div class="input-grid">
        <div class="input-group">
            <label>기초 길이 L (m)</label>
            <input type="number" id="L" value="2.00" step="0.01">
        </div>
        <div class="input-group">
            <label>기초 폭 B (m)</label>
            <input type="number" id="B" value="1.82" step="0.01">
        </div>
        <div class="input-group">
            <label>근입 깊이 Df (m)</label>
            <input type="number" id="Df" value="2.20" step="0.01">
        </div>
        <div class="input-group">
            <label>지하수위 WL (GL.-m)</label>
            <input type="number" id="WL" value="3.38" step="0.01">
        </div>
        <div class="input-group">
            <label>지지층 점착력 c (kN/m²)</label>
            <input type="number" id="c" value="3.00" step="0.01">
        </div>
        <div class="input-group">
            <label>내부마찰각 Φ (°)</label>
            <input type="number" id="phi" value="25.00" step="0.1">
        </div>
        <div class="input-group">
            <label>상부층 단위중량 γ1 (kN/m³)</label>
            <input type="number" id="gamma1" value="18.00" step="0.01">
        </div>
        <div class="input-group">
            <label>지지층 단위중량 γ2 (kN/m³)</label>
            <input type="number" id="gamma2" value="18.00" step="0.01">
        </div>
    </div>
    
    <p style="font-size: 0.85em; color: #555;">※ 물의 단위중량 = 9.807 kN/m³ 적용. 안전율 FS = 3 적용[cite: 15].</p>

    <button onclick="calculateAllBearingCapacities()">모든 공식 한 번에 비교 계산하기</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    const generalTable = [
        { phi: 0,  Nc: 5.7,   Nq: 1.0,   Ng: 0.0   },
        { phi: 5,  Nc: 7.3,   Nq: 1.6,   Ng: 0.5   },
        { phi: 10, Nc: 9.6,   Nq: 2.7,   Ng: 1.2   },
        { phi: 15, Nc: 12.9,  Nq: 4.5,   Ng: 2.5   },
        { phi: 20, Nc: 17.7,  Nq: 7.4,   Ng: 4.0   },
        { phi: 25, Nc: 25.1,  Nq: 12.7,  Ng: 9.7   },
        { phi: 30, Nc: 37.2,  Nq: 22.5,  Ng: 19.7  },
        { phi: 35, Nc: 57.8,  Nq: 41.4,  Ng: 42.5  },
        { phi: 40, Nc: 95.7,  Nq: 81.3,  Ng: 100.4 },
        { phi: 45, Nc: 172.3, Nq: 173.3, Ng: 297.5 }
    ];

    const localTable = [
        { phi: 0,  Nc: 5.7,   Nq: 1.0,   Ng: 0.0   },
        { phi: 5,  Nc: 6.7,   Nq: 1.4,   Ng: 0.2   },
        { phi: 10, Nc: 8.0,   Nq: 1.9,   Ng: 0.5   },
        { phi: 15, Nc: 9.7,   Nq: 2.7,   Ng: 0.9   },
        { phi: 20, Nc: 11.8,  Nq: 3.9,   Ng: 1.7   },
        { phi: 25, Nc: 14.8,  Nq: 5.6,   Ng: 3.2   },
        { phi: 30, Nc: 19.0,  Nq: 8.3,   Ng: 5.7   },
        { phi: 35, Nc: 25.2,  Nq: 12.6,  Ng: 10.1  },
        { phi: 40, Nc: 34.9,  Nq: 20.5,  Ng: 18.8  },
        { phi: 45, Nc: 51.2,  Nq: 35.1,  Ng: 37.7  }
    ];

    const modifiedTable = [
        { phi: 0,  Nc: 5.3,  Nq: 1.0,  Ng: 0.0  },
        { phi: 5,  Nc: 5.3,  Nq: 1.4,  Ng: 0.0  },
        { phi: 10, Nc: 6.5,  Nq: 1.9,  Ng: 0.0  },
        { phi: 15, Nc: 7.9,  Nq: 2.7,  Ng: 1.2  },
        { phi: 20, Nc: 9.9,  Nq: 3.9,  Ng: 2.0  },
        { phi: 25, Nc: 11.4, Nq: 5.6,  Ng: 3.3  },
        { phi: 28, Nc: 20.9, Nq: 7.1,  Ng: 4.4  },
        { phi: 32, Nc: 42.2, Nq: 14.1, Ng: 10.6 },
        { phi: 36, Nc: 95.7, Nq: 31.6, Ng: 30.5 },
        { phi: 40, Nc: 95.7, Nq: 81.2, Ng: 114.0 }
    ];

    function interpolateFactors(phiInput, table) {
        if (phiInput <= table[0].phi) {
            return { Nc: table[0].Nc, Nq: table[0].Nq, Ng: table[0].Ng };
        }
        const last = table[table.length - 1];
        if (phiInput >= last.phi) {
            return { Nc: last.Nc, Nq: last.Nq, Ng: last.Ng };
        }

        for (let i = 0; i < table.length - 1; i++) {
            let lower = table[i];
            let upper = table[i + 1];
            if (phiInput >= lower.phi && phiInput <= upper.phi) {
                let ratio = (phiInput - lower.phi) / (upper.phi - lower.phi);
                let Nc = lower.Nc + ratio * (upper.Nc - lower.Nc);
                let Nq = lower.Nq + ratio * (upper.Nq - lower.Nq);
                let Ng = lower.Ng + ratio * (upper.Ng - lower.Ng);
                return { Nc, Nq, Ng };
            }
        }
        return { Nc: table[5].Nc, Nq: table[5].Nq, Ng: table[5].Ng };
    }

    function calculateAllBearingCapacities() {
        const L = parseFloat(document.getElementById('L').value);
        const B = parseFloat(document.getElementById('B').value);
        const Df = parseFloat(document.getElementById('Df').value);
        const WL = parseFloat(document.getElementById('WL').value);
        const c_in = parseFloat(document.getElementById('c').value);
        const phi_in = parseFloat(document.getElementById('phi').value);
        const gamma1_in = parseFloat(document.getElementById('gamma1').value);
        const gamma2_in = parseFloat(document.getElementById('gamma2').value);
        
        const gamma_w = 9.807;

        let gamma1_eff = gamma1_in;
        let log1 = "";
        const gamma1_sub = gamma1_in - gamma_w;
        if (WL <= 0) {
            gamma1_eff = gamma1_sub;
            log1 = "지하수위 지표면(0m) 위치: 전구간 수중단위중량 적용";
        } else if (WL >= Df) {
            gamma1_eff = gamma1_in;
            log1 = "지하수위 근입깊이(Df) 하부 위치: 건조/습윤 단위중량 적용";
        } else {
            gamma1_eff = gamma1_sub + gamma_w * (WL / Df);
            log1 = "지하수위 지표~Df 사이 위치: 1차식 선형 보간 적용";
        }

        let gamma2_eff = gamma2_in;
        let log2 = "";
        const gamma2_sub = gamma2_in - gamma_w;
        const Df_plus_B = Df + B;
        if (WL <= Df) {
            gamma2_eff = gamma2_sub;
            log2 = "지하수위 기초저면(Df) 상부 위치: 전구간 수중단위중량 적용";
        } else if (WL >= Df_plus_B) {
            gamma2_eff = gamma2_in;
            log2 = "지하수위 기초저면+폭(Df+B) 하부 위치: 전구간 원 단위중량 적용";
        } else {
            gamma2_eff = gamma2_sub + gamma_w * ((WL - Df) / B);
            log2 = "지하수위 Df~Df+B 사이 위치: 1차식 선형 보간 적용";
        }

        const q = Df * gamma1_eff;
        const alpha = 1 + 0.3 * (B / L);
        const beta = 0.5 - 0.1 * (B / L);

        // 1. 전반전단파괴
        const f_gen = interpolateFactors(phi_in, generalTable);
        const term1_g = alpha * c_in * f_gen.Nc;
        const term2_g = q * f_gen.Nq;
        const term3_g = beta * gamma2_eff * B * f_gen.Ng;
        const q_ult_g = term1_g + term2_g + term3_g;
        const q_all_g = q_ult_g / 3.0;

        // 2. 국부전단파괴
        const c_local = (2.0 / 3.0) * c_in;[cite: 15]
        const phi_rad = phi_in * (Math.PI / 180);
        const phi_local = Math.atan((2.0 / 3.0) * Math.tan(phi_rad)) * (180 / Math.PI);[cite: 15]
        const f_loc = interpolateFactors(phi_local, localTable);
        const term1_l = alpha * c_local * f_loc.Nc;
        const term2_l = q * f_loc.Nq;
        const term3_l = beta * gamma2_eff * B * f_loc.Ng;
        const q_ult_l = term1_l + term2_l + term3_l;
        const q_all_l = q_ult_l / 3.0;

        // 3. Terzaghi 수정 지지력 공식
        const f_mod = interpolateFactors(phi_local, modifiedTable);
        const term1_m = alpha * c_local * f_mod.Nc;
        const term2_m = q * f_mod.Nq;
        const term3_m = beta * gamma2_eff * B * f_mod.Ng;
        const q_ult_m = term1_m + term2_m + term3_m;
        const q_all_m = q_ult_m / 3.0;

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <div class="section-title">[종합 비교 요약 결과] (안전율 FS = 3)</div>
            <div class="table-container">
                <table class="summary-table">
                    <tr>
                        <th>지지력 산정 방법</th>
                        <th>극한지지력 ($q_{ult}$)</th>
                        <th>허용지지력 ($q_{all}$)</th>
                    </tr>
                    <tr>
                        <td><strong>Terzaghi 전반전단파괴</strong></td>
                        <td>${q_ult_g.toFixed(2)} kN/m²</td>
                        <td style="font-weight:bold; color:#2980b9;">${q_all_g.toFixed(2)} kN/m²</td>
                    </tr>
                    <tr>
                        <td><strong>Terzaghi 국부전단파괴</strong></td>
                        <td>${q_ult_l.toFixed(2)} kN/m²</td>
                        <td style="font-weight:bold; color:#2980b9;">${q_all_l.toFixed(2)} kN/m²</td>
                    </tr>
                    <tr>
                        <td><strong>Terzaghi 수정 지지력공식</strong></td>
                        <td>${q_ult_m.toFixed(2)} kN/m²</td>
                        <td style="font-weight:bold; color:#2980b9;">${q_all_m.toFixed(2)} kN/m²</td>
                    </tr>
                </table>
            </div>

            <div class="section-title">[공통 지반 및 기초 검증 데이터]</div>
            - 상부층 보간 적용치 ($\gamma_1$): <strong>${gamma1_eff.toFixed(2)} kN/m³</strong> (${log1})<br>
            - 지지층 보간 적용치 ($\gamma_2$): <strong>${gamma2_eff.toFixed(2)} kN/m³</strong> (${log2})<br>
            - 유효 상재하중 ($q = D_f \times \gamma_1$): <strong>${q.toFixed(2)} kN/m²</strong><br><br>

            <div class="section-title">[검증 1] Terzaghi 기초형상계수 표</div>
            <div class="table-container">
                <table class="result-table">
                    <tr>
                        <th>형상계수</th>
                        <th>연속기초</th>
                        <th>원형기초</th>
                        <th>정사각형</th>
                        <th>직사각형</th>
                        <th>적용값</th>
                    </tr>
                    <tr>
                        <td><strong>$\alpha$</strong></td>
                        <td>1.0</td>
                        <td>1.3</td>
                        <td>1.3</td>
                        <td>$1 + 0.3B/L$</td>
                        <td style="background:#e8f8f5; font-weight:bold;">${alpha.toFixed(2)}</td>
                    </tr>
                    <tr>
                        <td><strong>$\beta$</strong></td>
                        <td>0.5</td>
                        <td>0.3</td>
                        <td>0.4</td>
                        <td>$0.5 - 0.1B/L$</td>
                        <td style="background:#e8f8f5; font-weight:bold;">${beta.toFixed(2)}</td>
                    </tr>
                </table>
            </div>

            <div class="section-title">[검증 2] Terzaghi 수정 지지력계수 표 (적용 $\phi' = ${phi_local.toFixed(2)}^\circ$)</div>[cite: 15]
            <div class="table-container">
                <table class="result-table" style="font-size: 0.75em;">
                    <tr>
                        <th>계수</th>
                        <th>$0^\circ$</th><th>$5^\circ$</th><th>$10^\circ$</th><th>$15^\circ$</th><th>$20^\circ$</th><th>$25^\circ$</th><th>$28^\circ$</th><th>$32^\circ$</th><th>$36^\circ$</th><th>$40^\circ$ 이상</th>
                        <th style="background:#e8f8f5;">적용값</th>
                    </tr>
                    <tr>
                        <td><strong>$N_c''$</strong></td>
                        <td>5.3</td><td>5.3</td><td>6.5</td><td>7.9</td><td>9.9</td><td>11.4</td><td>20.9</td><td>42.2</td><td>95.7</td><td>95.7</td>
                        <td style="background:#e8f8f5; font-weight:bold; color:#2980b9;">${f_mod.Nc.toFixed(2)}</td>
                    </tr>
                    <tr>
                        <td><strong>$N_q''$</strong></td>
                        <td>1.0</td><td>1.4</td><td>1.9</td><td>2.7</td><td>3.9</td><td>5.6</td><td>7.1</td><td>14.1</td><td>31.6</td><td>81.2</td>
                        <td style="background:#e8f8f5; font-weight:bold; color:#2980b9;">${f_mod.Nq.toFixed(2)}</td>
                    </tr>
                    <tr>
                        <td><strong>$N_\gamma''$</strong></td>
                        <td>0.0</td><td>0.0</td><td>0.0</td><td>1.2</td><td>2.0</td><td>3.3</td><td>4.4</td><td>10.6</td><td>30.5</td><td>114.0</td>
                        <td style="background:#e8f8f5; font-weight:bold; color:#2980b9;">${f_mod.Ng.toFixed(2)}</td>
                    </tr>
                </table>
            </div>

            <div class="section-title">[검증 3] Terzaghi 수정 지지력공식 항별 세부내역</div>[cite: 15]
            - 보정 강도 정수: $c' = \frac{2}{3} \times ${c_in.toFixed(2)} = <strong>${c_local.toFixed(2)} kN/m²</strong>, \phi' = \tan^{-1}\left(\frac{2}{3}\tan(${phi_in.toFixed(2)}^\circ)\right) = <strong>${phi_local.toFixed(2)}^\circ$</strong>[cite: 15]<br>
            - ① 점착력 항 ($\alpha \cdot c' \cdot N_c''$): ${alpha.toFixed(2)} \times ${c_local.toFixed(2)} \times ${f_mod.Nc.toFixed(2)} = <strong>${term1_m.toFixed(2)} kN/m²</strong><br>
            - ② 상재하중 항 ($q \cdot N_q''$): ${q.toFixed(2)} \times ${f_mod.Nq.toFixed(2)} = <strong>${term2_m.toFixed(2)} kN/m²</strong><br>
            - ③ 중량 항 ($\beta \cdot \gamma_2 \cdot B \cdot N_\gamma''$): ${beta.toFixed(2)} \times ${gamma2_eff.toFixed(2)} \times ${B.toFixed(2)} \times ${f_mod.Ng.toFixed(2)} = <strong>${term3_m.toFixed(2)} kN/m²</strong><br><br>

            <div class="section-title">[검증 4] 수정 지지력 공식 최종 결과</div>[cite: 15]
            - 극한지지력 ($q_{ult}$): ${term1_m.toFixed(2)} + ${term2_m.toFixed(2)} + ${term3_m.toFixed(2)} = <strong>${q_ult_m.toFixed(2)} kN/m²</strong>[cite: 15]<br>
            - 허용지지력 ($q_{all}, FS=3$): ${q_ult_m.toFixed(2)} / 3 = <strong>${q_all_m.toFixed(2)} kN/m²</strong>[cite: 15]
        `;
    }
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>

</body>
</html>
