<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기초 지지력 계산기 (Terzaghi)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        
        /* 모바일 반응형 입력 그리드 스타일 (칸 넘침 방지 min-width 추가) */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) {
            .input-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .input-group {
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            min-width: 0; /* 그리드 내부 요소가 칸을 뚫고 나가는 현상 방지 */
        }
        .input-group label {
            font-size: 0.8em;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            word-break: keep-all;
        }
        .input-group input {
            width: 100%;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1.05em;
        }
        
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #e8f8f5; border-left: 5px solid #1abc9c; font-size: 1.0em; line-height: 1.6; }
    </style>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c8c8c8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">
    <h2>◎ 기초 지지력 산정 (Terzaghi)</h2>
    
    <h3>1. 설계자료 입력</h3>
    
    <!-- 소수점 둘째 자리까지 기본 표현되도록 값 수정 -->
    <div class="input-grid">
        <div class="input-group">
            <label>기초 길이 L (m)</label>
            <input type="number" id="L" value="2.00" step="0.01">
        </div>
        <div class="input-group">
            <label>기초 폭 B (m)</label>
            <input type="number" id="B" value="1.82" step="0.01">
        </div>
        <div class="input-group">
            <label>근입 깊이 Df (m)</label>
            <input type="number" id="Df" value="2.20" step="0.01">
        </div>
        <div class="input-group">
            <label>지하수위 WL (GL.-m)</label>
            <input type="number" id="WL" value="4.10" step="0.01">
        </div>
        <div class="input-group">
            <label>지지층 점착력 c (kN/m²)</label>
            <input type="number" id="c" value="3.00" step="0.01">
        </div>
        <div class="input-group">
            <label>상부층 단위중량 γ1 (kN/m³)</label>
            <input type="number" id="gamma1" value="18.00" step="0.01">
        </div>
        <div class="input-group">
            <label>지지층 단위중량 γ2 (kN/m³)</label>
            <input type="number" id="gamma2" value="18.00" step="0.01">
        </div>
    </div>
    
    <p style="font-size: 0.85em; color: #555;">※ 물의 단위중량 = 9.807 kN/m³ 적용<br>※ 내부마찰각(Φ) = 25도 기준 (Nc=25.1, Nq=12.7, Nγ=9.7).</p>

    <button onclick="calculateBearingCapacity()">지지력 계산하기</button>

    <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
    function calculateBearingCapacity() {
        // 1. 입력값 가져오기
        const L = parseFloat(document.getElementById('L').value);
        const B = parseFloat(document.getElementById('B').value);
        const Df = parseFloat(document.getElementById('Df').value);
        const WL = parseFloat(document.getElementById('WL').value);
        const c = parseFloat(document.getElementById('c').value);
        const gamma1_in = parseFloat(document.getElementById('gamma1').value);
        const gamma2_in = parseFloat(document.getElementById('gamma2').value);
        
        const gamma_w = 9.807;

        // 2. 상부층 단위중량(γ1) 지하수위 보간 로직
        let gamma1_eff = gamma1_in;
        let log1 = "";
        const gamma1_sub = gamma1_in - gamma_w;

        if (WL <= 0) {
            gamma1_eff = gamma1_sub;
            log1 = "지하수위가 지표면(0m)에 위치하여 전구간 수중단위중량 적용";
        } else if (WL >= Df) {
            gamma1_eff = gamma1_in;
            log1 = "지하수위가 근입깊이(Df)보다 아래에 위치하여 건조/습윤 단위중량 적용";
        } else {
            gamma1_eff = gamma1_sub + gamma_w * (WL / Df);
            log1 = "지하수위가 지표~Df 사이에 위치 (1차식 보간 적용)";
        }

        // 3. 지지층 단위중량(γ2) 지하수위 보간 로직
        let gamma2_eff = gamma2_in;
        let log2 = "";
        const gamma2_sub = gamma2_in - gamma_w;
        const Df_plus_B = Df + B;

        if (WL <= Df) {
            gamma2_eff = gamma2_sub;
            log2 = "지하수위가 기초 저면(Df)보다 위에 위치하여 전구간 수중단위중량 적용";
        } else if (WL >= Df_plus_B) {
            gamma2_eff = gamma2_in;
            log2 = "지하수위가 기초저면+폭(Df+B)보다 아래에 위치하여 전구간 원 단위중량 적용";
        } else {
            gamma2_eff = gamma2_sub + gamma_w * ((WL - Df) / B);
            log2 = "지하수위가 Df~Df+B 사이에 위치 (1차식 보간 적용)";
        }

        // 4. 유효 상재하중(q) 산정
        const q = Df * gamma1_eff;

        // 5. 형상계수 산정 (직사각형 기초)
        const alpha = 1 + 0.3 * (B / L);
        const beta = 0.5 - 0.1 * (B / L);

        // 6. 지지력 계수 (Φ=25도 기준)
        const Nc = 25.1;
        const Nq = 12.7;
        const Ng = 9.7;

        // 7. Terzaghi 극한지지력 산정 항별 계산
        const term1 = alpha * c * Nc;
        const term2 = q * Nq;
        const term3 = beta * gamma2_eff * B * Ng;
        const q_ult = term1 + term2 + term3;

        // 8. 허용지지력 산정 (안전율 FS = 3)
        const q_all = q_ult / 3;

        // 9. 결과 출력 HTML 구성 (소수점 둘째 자리 통일)
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <strong>[1] 지하수위 및 단위중량 보간 검증</strong><br>
            - 상부층 보간 적용치(γ1): <strong>${gamma1_eff.toFixed(2)} kN/m³</strong><br>
              &nbsp;&nbsp;(${log1})<br>
            - 지지층 보간 적용치(γ2): <strong>${gamma2_eff.toFixed(2)} kN/m³</strong><br>
              &nbsp;&nbsp;(${log2})<br><br>

            <strong>[2] 유효 상재하중(q) 산정</strong><br>
            - q = Df(${Df.toFixed(2)}) × γ1_eff(${gamma1_eff.toFixed(2)}) = <strong>${q.toFixed(2)} kN/m²</strong><br><br>

            <strong>[3] 형상계수 산정</strong><br>
            - α = 1 + 0.3(B/L) = <strong>${alpha.toFixed(2)}</strong><br>
            - β = 0.5 - 0.1(B/L) = <strong>${beta.toFixed(2)}</strong><br><br>

            <strong>[4] Terzaghi 극한지지력 항별 세부내역</strong><br>
            - ① 점착력 항 (α·c·Nc): ${alpha.toFixed(2)} × ${c.toFixed(2)} × ${Nc} = <strong>${term1.toFixed(2)} kN/m²</strong><br>
            - ② 상재하중 항 (q·Nq): ${q.toFixed(2)} × ${Nq} = <strong>${term2.toFixed(2)} kN/m²</strong><br>
            - ③ 중량 항 (β·γ2·B·Nγ): ${beta.toFixed(2)} × ${gamma2_eff.toFixed(2)} × ${B.toFixed(2)} × ${Ng} = <strong>${term3.toFixed(2)} kN/m²</strong><br><br>

            <strong>[5] 최종 지지력 결과</strong><br>
            - 극한지지력 (q_ult): <strong>${q_ult.toFixed(2)} kN/m²</strong><br>
            - 허용지지력 (q_all, FS=3): <strong>${q_all.toFixed(2)} kN/m²</strong>
        `;
    }
</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>

</body>
</html>
